*{box-sizing:border-box}body{margin:0;background:#f7f8f5;color:#111c1c;font-family:Inter,Arial,sans-serif}header{max-width:1260px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:28px 32px}.logo{font-size:28px;font-weight:750;letter-spacing:-1.6px}.logo b{color:#000}button,select{font:inherit;color:inherit;border:1px solid #bccbc7;border-radius:28px;padding:12px 20px;background:transparent;cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #168170;outline-offset:4px}main{max-width:1260px;margin:auto;padding:38px 32px 80px}.eyebrow{font-size:12px;letter-spacing:2px;color:#4a6863;text-transform:uppercase}h1{font-size:clamp(38px,5.3vw,70px);line-height:1.05;letter-spacing:-2.4px;max-width:900px;margin:22px 0}#intro{font-size:19px;line-height:1.6;max-width:700px;color:#4c605d}.toolbar{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:38px 0 25px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.card{background:white;border:1px solid #dce5e1;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.art svg{display:block;width:100%;height:auto}.content{padding:24px;display:flex;flex-direction:column;flex:1}.status{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:#34675e}h2{font-size:23px;line-height:1.2;margin:14px 0}.card p{font-size:14px;color:#4c605d;line-height:1.6;flex:1}.card button{text-align:left;border:0;padding:12px 0 0;border-radius:0;font-weight:650;color:#185f50}.foot{margin-top:50px;padding:25px 0;border-top:1px solid #cedbd6;font-size:14px;line-height:1.7;max-width:850px}.foot a{color:#185f50}dialog{border:0;border-radius:18px;padding:32px;max-width:760px;width:calc(100% - 32px);max-height:88vh;color:#122421}dialog::backdrop{background:#0c2825b8}dialog .close{float:right}dialog h2{padding-right:90px;font-size:30px}dt{font-weight:700;margin-top:20px}dd{margin:7px 0 0;line-height:1.7;color: </style></head><body><header><div class="logo" aria-label="FortiX">Forti<b>X</b></div><button id="lang" type="button">English</button></header><main><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="intro"></p><p id="notice"></p><div class="toolbar"><label id="filterlabel" for="filter"></label><select id="filter"></select><span id="count" role="status" aria-live="polite"></span></div><div class="grid" id="grid"></div><p class="foot" id="foot"></p></main><dialog id="detail" aria-labelledby="detailtitle"><button class="close" type="button" id="close"></button><span class="status" id="detailstatus"></span><h2 id="detailtitle"></h2><dl id="fields"></dl></dialog><script>
const data=[{"id": "mobility", "status": "demonstration", "fr": {"title": "Mobilité autonome", "scenario": "D-006 : une mission de taxi traverse ville, véhicule, choix de route, approbation humaine et paiement. Le monde et le routage sont simulés.", "actors": "Ville, véhicule, fournisseur de route, humain, prestataire de paiement, banque.", "boundaries": "Décision de circulation → véhicule ; sélection → résolution du modèle ; autorisation → ordre bancaire.", "evidence": "Événements sources signés, journal runtime, liens causaux, décision humaine liée, Final Receipt et PEB.", "can": "Recalculer les signatures prises en charge, les identités attendues et la fermeture du profil D-006 ; distinguer les preuves manquantes.", "cannot": "Prouver un trajet physique, le bon jugement de conduite, l’origine des événements runtime ou le règlement bancaire."}, "en": {"title": "Autonomous mobility", "scenario": "D-006: a taxi mission crosses city, vehicle, route selection, human approval and payment. The world and routing are simulated.", "actors": "City, vehicle, routing provider, human, payment provider and bank.", "boundaries": "Traffic decision → vehicle; model selection → resolution; authorization → bank instruction.", "evidence": "Signed source events, runtime journal, causal links, bound human decision, Final Receipt and PEB.", "can": "Recompute supported signatures, expected identities and D-006 profile closure; distinguish missing evidence.", "cannot": "Prove physical travel, driving judgment, runtime event origin or bank settlement."}}, {"id": "finance", "status": "concept", "fr": {"title": "Finance et paiements agentiques", "scenario": "Un agent prépare un paiement ; une autorité autorise le montant et le bénéficiaire ; une banque confirme ou laisse le résultat inconnu. D-006 illustre seulement une partie de ces frontières.", "actors": "Agent, donneur d’ordre, approbateur, prestataire et banque.", "boundaries": "Intention → autorisation ; ordre → acceptation ; acceptation → effet sur compte.", "evidence": "Objet de paiement exact, mandat, approbation signée, accusé fournisseur, observation bancaire et identifiants de corrélation.", "can": "Un profil futur pourrait vérifier la cohérence des attestations et conserver l’incertitude si un accusé manque.", "cannot": "Certifier KYC/AML, licéité, solvabilité ou règlement réel sans preuve de banque authentifiée ; ce cas n’est pas un connecteur livré."}, "en": {"title": "Finance and agentic payments", "scenario": "An agent prepares a payment; an authority approves its amount and beneficiary; a bank confirms the result or leaves it unknown. D-006 illustrates only part of these boundaries.", "actors": "Agent, principal, approver, payment provider and bank.", "boundaries": "Intent → authorization; order → acceptance; acceptance → account effect.", "evidence": "Exact payment object, mandate, signed approval, provider acknowledgment, bank observation and correlation IDs.", "can": "A future profile could verify attestation consistency and preserve uncertainty when an acknowledgment is missing.", "cannot": "Certify KYC/AML, legality, creditworthiness or real settlement without authenticated bank evidence; this is not a shipped connector."}}, {"id": "industry", "status": "concept", "fr": {"title": "Industrie et robotique", "scenario": "Un robot reçoit une consigne, franchit une autorisation de sécurité puis présente un compte rendu d’exécution.", "actors": "Ordonnanceur, automate, robot, opérateur, capteur indépendant.", "boundaries": "Planification → commande ; autorisation sécurité → exécution ; exécution → mesure.", "evidence": "Commande exacte, version du programme, accord d’opérateur, accusé automate et mesure de capteur attestée.", "can": "Un profil à construire pourrait relier la commande aux attestations disponibles et indiquer un effet non observé.", "cannot": "Garantir la sécurité fonctionnelle, l’absence de défaut mécanique ou un mouvement réel à partir d’un journal seul."}, "en": {"title": "Industry and robotics", "scenario": "A robot receives an instruction, crosses a safety approval boundary and returns an execution report.", "actors": "Scheduler, controller, robot, operator and independent sensor.", "boundaries": "Planning → command; safety authorization → execution; execution → measurement.", "evidence": "Exact command, program version, operator approval, controller acknowledgment and attested sensor measurement.", "can": "A future profile could bind commands to available attestations and identify an unobserved effect.", "cannot": "Guarantee functional safety, mechanical soundness or physical movement from a log alone."}}, {"id": "cybersecurity", "status": "concept", "fr": {"title": "Cybersécurité", "scenario": "Un agent propose une mise en quarantaine ; le responsable autorise un périmètre ; un contrôle indépendant observe son application.", "actors": "Agent de sécurité, analyste, autorité, point de contrôle et observateur.", "boundaries": "Détection → décision ; approbation → changement ; changement → observation.", "evidence": "Empreinte de l’alerte, cible exacte, mandat, approbation, accusé de configuration et mesure indépendante.", "can": "Un profil futur pourrait séparer ce qui a été autorisé, demandé et observé, avec une piste causale.", "cannot": "Garantir qu’une attaque est stoppée, qu’une cible est saine ou qu’une politique est correcte sans observations adaptées."}, "en": {"title": "Cybersecurity", "scenario": "An agent proposes quarantine; a responsible authority approves its scope; an independent check observes application.", "actors": "Security agent, analyst, authority, enforcement point and observer.", "boundaries": "Detection → decision; approval → change; change → observation.", "evidence": "Alert digest, exact target, mandate, approval, configuration acknowledgment and independent measurement.", "can": "A future profile could separate authorized, requested and observed states with a causal trail.", "cannot": "Guarantee an attack has stopped, a target is clean or a policy is correct without appropriate observations."}}, {"id": "health", "status": "concept", "fr": {"title": "Santé", "scenario": "Un assistant prépare une recommandation administrative ou clinique à relire ; un professionnel décide et le système trace la suite. Aucune donnée patient n’est utilisée dans cette illustration.", "actors": "Assistant, professionnel habilité, système métier et dépositaire de preuves.", "boundaries": "Sortie du modèle → revue humaine ; décision → enregistrement ; enregistrement → action.", "evidence": "Version du modèle, références de données minimisées, décision humaine liée et accusés du système.", "can": "Un profil futur pourrait vérifier des attestations et tracer les frontières de responsabilité sans divulguer le dossier complet.", "cannot": "Établir une efficacité clinique, une décision médicale correcte, un consentement valide ou une conformité à partir de signatures seules."}, "en": {"title": "Healthcare", "scenario": "An assistant prepares an administrative or clinical recommendation for review; a qualified professional decides and the system records what follows. No patient data is used in this illustration.", "actors": "Assistant, qualified professional, business system and evidence custodian.", "boundaries": "Model output → human review; decision → record; record → action.", "evidence": "Model version, minimized data references, bound human decision and system acknowledgments.", "can": "A future profile could verify attestations and trace responsibility boundaries without disclosing a full record.", "cannot": "Establish clinical efficacy, a correct medical decision, valid consent or compliance from signatures alone."}}, {"id": "cloud", "status": "concept", "fr": {"title": "Cloud et souveraineté", "scenario": "Un agent demande une migration de charge vers une région autorisée ; le fournisseur répond et des observations documentent le placement effectif.", "actors": "Agent, propriétaire de charge, fournisseur cloud et observateur.", "boundaries": "Politique → sélection fournisseur ; API → déploiement ; déclaration de région → observation.", "evidence": "Politique versionnée, identité du fournisseur, ordre exact, accusé API et observation de placement attestée.", "can": "Un profil futur pourrait comparer région demandée, région déclarée et éléments d’observation disponibles.", "cannot": "Garantir une souveraineté juridique, l’absence de réplication ou la résidence physique de données sans sources indépendantes suffisantes."}, "en": {"title": "Cloud and sovereignty", "scenario": "An agent requests workload migration to an allowed region; the provider responds and observations document actual placement.", "actors": "Agent, workload owner, cloud provider and observer.", "boundaries": "Policy → provider selection; API → deployment; region declaration → observation.", "evidence": "Versioned policy, provider identity, exact instruction, API acknowledgment and attested placement observation.", "can": "A future profile could compare requested region, declared region and available observations.", "cannot": "Guarantee legal sovereignty, absence of replication or physical data residency without sufficient independent sources."}}, {"id": "enterprise", "status": "pilot", "fr": {"title": "Agents IA d’entreprise", "scenario": "Piste de pilote envisagé : un agent prépare une modification métier, un humain autorise l’action exacte et le système fournit son résultat. Aucun client ou partenaire n’est engagé.", "actors": "Agent, propriétaire de processus, approbateur, outil et vérificateur.", "boundaries": "Mandat → appel d’outil ; sélection de modèle → résolution ; approbation → effet.", "evidence": "Mandat borné, provenance modèle/fournisseur, objet d’action exact, preuve d’approbation et accusé d’outil.", "can": "Un pilote à définir pourrait mesurer la traçabilité et le refus d’une action dépourvue des preuves requises, avec un contrôle d’exécution distinct.", "cannot": "Fournir aujourd’hui un contrôle générique de tous les outils, prouver la qualité d’un modèle ou la réussite d’une opération réelle."}, "en": {"title": "Enterprise AI agents", "scenario": "Proposed pilot direction: an agent prepares a business change, a human authorizes the exact action and the system reports its result. No customer or partner is committed.", "actors": "Agent, process owner, approver, tool and verifier.", "boundaries": "Mandate → tool call; model selection → resolution; approval → effect.", "evidence": "Bounded mandate, model/provider provenance, exact action object, approval evidence and tool acknowledgment.", "can": "A future pilot could measure traceability and refusal when required evidence is missing, with separate execution enforcement.", "cannot": "Provide generic control of every tool today, prove model quality or prove a real operation succeeded."}}, {"id": "logistics", "status": "concept", "fr": {"title": "Logistique", "scenario": "Un transporteur remet un colis à un autre acteur ; deux parties attestent la prise en charge et un destinataire confirme ou conteste la livraison.", "actors": "Expéditeur, transporteurs, capteur, destinataire et vérificateur.", "boundaries": "Garde A → garde B ; scan → transfert ; accusé → livraison physique.", "evidence": "Identifiant de colis pseudonymisé, attestations des deux parties, liens de transfert et observation de livraison.", "can": "Un profil futur pourrait détecter des attestations contradictoires et montrer où la chaîne de garde reste incomplète.", "cannot": "Prouver le contenu du colis, son état physique ou une livraison réelle avec un simple scan non attesté."}, "en": {"title": "Logistics", "scenario": "A carrier hands a parcel to another party; both attest custody and a recipient confirms or disputes delivery.", "actors": "Sender, carriers, sensor, recipient and verifier.", "boundaries": "Custody A → custody B; scan → transfer; acknowledgment → physical delivery.", "evidence": "Pseudonymous parcel ID, both parties’ attestations, transfer links and delivery observation.", "can": "A future profile could detect conflicting attestations and show where custody evidence remains incomplete.", "cannot": "Prove parcel contents, physical condition or real delivery from an unattested scan."}}],images=["<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 230\" role=\"img\"><title>Mobilité autonome</title><rect width=\"320\" height=\"230\" fill=\"#eef4f2\"/><circle cx=\"269\" cy=\"44\" r=\"52\" fill=\"#e3ece7\"/><g fill=\"none\" stroke=\"#173b3a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M35 152h250M58 152v-58h42v58M232 152V67h37v85\"/><path d=\"M106 139l12-31h72l23 31v25H99v-25z\" fill=\"#bfe5dc\"/><circle cx=\"121\" cy=\"164\" r=\"12\"/><circle cx=\"192\" cy=\"164\" r=\"12\"/><path d=\"M149 49v31m-14-16h29\"/></g></svg>", "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 230\" role=\"img\"><title>Finance et paiements agentiques</title><rect width=\"320\" height=\"230\" fill=\"#eef4f2\"/><circle cx=\"269\" cy=\"44\" r=\"52\" fill=\"#e3ece7\"/><g fill=\"none\" stroke=\"#173b3a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M70 93l90-40 90 40H70zm7 85h166M90 106v60m46-60v60m47-60v60m47-60v60\"/><circle cx=\"260\" cy=\"151\" r=\"25\" fill=\"#bfe5dc\"/><path d=\"M247 151l9 9 17-19\"/></g></svg>", "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 230\" role=\"img\"><title>Industrie et robotique</title><rect width=\"320\" height=\"230\" fill=\"#eef4f2\"/><circle cx=\"269\" cy=\"44\" r=\"52\" fill=\"#e3ece7\"/><g fill=\"none\" stroke=\"#173b3a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M70 182h174M97 180v-50l54-36 40 34 30-25\"/><circle cx=\"97\" cy=\"130\" r=\"13\" fill=\"#bfe5dc\"/><circle cx=\"151\" cy=\"94\" r=\"15\" fill=\"#bfe5dc\"/><path d=\"M199 92l22 11 8 23M199 92l-5 20\"/><path d=\"M53 64h60m-60 16h40\"/></g></svg>", y=\"111\" r=\"36\" fill=\"#bfe5dc\"/><circle cx=\"68\" cy=\"66\" r=\"21\"/><circle cx=\"251\" cy=\"66\" r=\"21\"/><circle cx=\"69\" cy=\"179\" r=\"21\"/><circle cx=\"251\" cy=\"179\" r=\"21\"/><path d=\"M87 75l41 23m64 0l40-23M88 168l42-32m61 0l41 32M147 108h26m-13-13v27\"/></g></svg>", "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 230\" role=\"img\"><title>Logistique</title><rect width=\"320\" height=\"230\" fill=\"#eef4f2\"/><circle cx=\"269\" cy=\"44\" r=\"52\" fill=\"#e3ece7\"/><g fill=\"none\" stroke=\"#173b3a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M56 94l57-30 57 30-57 30zM56 94v65l57 31 57-31V94M113 124v66\" fill=\"#bfe5dc\"/><path d=\"M194 111h52l28 32v32h-80zM224 111v33h50\"/><circle cx=\"210\" cy=\"178\" r=\"12\"/><circle cx=\"257\" cy=\"178\" r=\"12\"/><path d=\"M203 74h61m-41-15h41\"/></g></svg>"];let locale='fr';const el=id=>document.getElementById(id);const copy={fr:{eyebrow:'Bibliothèque sectorielle · préparation',title:'Un monde d’actions. Une exigence de preuve.',intro:'Suivre ce qui a été autorisé, ce qui a été exécuté et ce qui peut être établi à partir des preuves reçues.',notice:'Prototype éditorial à relire. D-006 est une démonstration ; les autres cas décrivent des possibilités à construire, sans référence client ni certification.',all:'Tous les statuts',demonstration:'Démonstration',concept:'Illustration conceptuelle',pilot:'Pilote envisagé',filter:'Filtrer par statut',read:'Explorer le scénario →',close:'Fermer',labels:{scenario:'Scénario',actors:'Acteurs',boundaries:'Frontières traversées',evidence:'Preuves nécessaires',can:'Ce que FortiX peut établir',cannot:'Ce qui n’est pas démontré'},foot:'Référence technique : D-006, PEB et limites de vérification. Les attestations runtime individuelles, le temps de confiance et le règlement bancaire restent à établir.',ref:'Lire le périmètre D-006',count:'cas affichés'},en:{eyebrow:'Sector library · preparation',title:'A world of actions. One demand for proof.',intro:'Trace what was authorized, what was executed and what the received evidence can establish.',notice:'Editorial prototype for review. D-006 is a demonstration; other cases describe capabilities to build, with no customer reference or certification.',all:'All statuses',demonstration:'Demonstration',concept:'Conceptual illustration',pilot:'Proposed pilot',filter:'Filter by status',read:'Explore the scenario →',close:'Close',labels:{scenario:'Scenario',actors:'Actors',boundaries:'Boundaries crossed',evidence:'Required evidence',can:'What FortiX can establish',cannot:'What is not demonstrated'},foot:'Technical reference: D-006, PEB and verification limits. Individual runtime attestations, trusted time and bank settlement remain unestablished.',ref:'Read the D-006 scope',count:'cases shown'}};
function show(id){const c=data.find(v=>v.id===id),t=copy[locale];el('detailstatus').textContent=t[c.status];el('detailtitle').textContent=c[locale].title;el('close').textContent=t.close;el('fields').replaceChildren();for(const [key,label]of Object.entries(t.labels)){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=c[locale][key];el('fields').append(dt,dd)}el('detail').showModal()}
function render(){const t=copy[locale],selected=el('filter').value||'all';document.documentElement.lang=locale;for(const key of ['eyebrow','title','intro','notice'])el(key).textContent=t[key];el('filterlabel').textContent=t.filter;el('lang').textContent=locale==='fr'?'English':'Français';el('filter').replaceChildren();for(const value of ['all','demonstration','concept','pilot']){const o=document.createElement('option');o.value=value;o.textContent=t[value];el('filter').append(o)}el('filter').value=selected;el('grid').replaceChildren();const visible=data.filter(c=>selected==='all'||c.status===selected);for(const c of visible){const article=document.createElement('article');article.className='card';const art=document.createElement('div');art.className='art';art.innerHTML=images[data.indexOf(c)];art.querySelector('title').textContent=c[locale].title;const content=document.createElement('div');content.className='content';const status=document.createElement('span');status.className='status';status.textContent=t[c.status];const h=document.createElement('h2');h.textContent=c[locale].title;const p=document.createElement('p');p.textContent=c[locale].scenario;const button=document.createElement('button');button.type='button';button.textContent=t.read;button.setAttribute('aria-label',t.read+' '+c[locale].title);button.onclick=()=>show(c.id);content.append(status,h,p,button);article.append(art,content);el('grid').append(article)}el('count').textContent=visible.length+' / '+data.length+' '+t.count;el('foot').textContent=t.foot+' ';const a=document.createElement('a');a.href='https://github.com/youneselyamani01-wq/fortix/blob/32b5e72d2df12e522209eaad3f45a334ca10c358/docs/evidence/D006-PUBLIC-REFERENCE.md';a.textContent=t.ref;el('foot').append(a)}
