[build-system]
requires      = ["setuptools==84.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name            = "fortix-adr"
version         = "1.0.0"
description     = "FortiX Audit Decision Record — standalone Python implementation"
requires-python = ">=3.11"
dependencies    = [
    "blake3==1.0.8",
    "PyNaCl==1.6.2",
    "httpx==0.28.1",
    "pydantic==2.8.2",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["adr*", "fortix_sdk*"]
